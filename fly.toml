app = 'replace-with-your-unique-game-name'
primary_region = 'bom'
[build]
  dockerfile = 'Dockerfile'
[env]
  PORT = '2567'
  DATA_DIR = '/data'
[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'
[[mounts]]
  source = 'game_data'
  destination = '/data'
[[vm]]
  memory = '1gb'
  cpus = 1
